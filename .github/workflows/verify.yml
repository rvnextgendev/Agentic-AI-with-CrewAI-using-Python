name: Verify local and Cloud compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_OPT_OUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify runtime
        run: python runtime_check.py
      - name: Install shared dependencies
        run: python -m pip install -r requirements.txt
      - name: Check native imports and dependency consistency
        run: |
          python -c "import streamlit; import pyarrow; import onnxruntime; import crewai; print('UI and agent imports passed')"
          python -m pip check
      - name: Test without API calls
        run: python -m unittest discover -s tests -v
